<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neon Clocktower Demoscene</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="gl"></canvas>

    <div class="hud">
      <h1>NEON CLOCKTOWER // DEMOSCENE CUT</h1>
      <p>Drag to orbit. Scroll to zoom. Press C for cinematic mode.</p>
      <div class="controls-row">
        <select id="sceneChooser" aria-label="Scene Chooser">
          <option value="clocktower">Clocktower (Default)</option>
          <option value="binaryExternal">Binary System (External)</option>
          <option value="binarySurface">Binary System (Planet POV)</option>
        </select>
        <button id="audioToggle" type="button">Start Audio</button>
        <button id="modeBadge" type="button">Manual Camera</button>
        <span id="timeIndicator">Time --:--</span>
      </div>
    </div>

    <div id="orbitSchematic" class="orbit-schematic hidden" aria-hidden="true">
      <canvas id="orbitSchematicCanvas"></canvas>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
